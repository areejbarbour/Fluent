name: fluent
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  google_fonts: ^8.1.0
  smooth_page_indicator: ^2.0.1
  flutter_screenutil: ^5.9.3
  dio: ^5.9.2
  shared_preferences: ^2.5.5
  flutter_bloc: ^9.1.1
  google_sign_in: ^6.2.1
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  video_player: ^2.13.0
  file_picker: ^11.0.3
  intl: ^0.20.3
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  flutter_stripe: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/onboarding/register_logo.png"
  adaptive_icon_background: "#00537A"
  adaptive_icon_foreground: "assets/images/onboarding/register_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/onboarding/
    - assets/background/